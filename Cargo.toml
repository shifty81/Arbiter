    "crates/cortex_model_host",
    "crates/cortex_observability",
    "crates/cortex_permissions",
    "crates/cortex_plugin",
    "crates/cortex_process",
    "crates/cortex_project",
    "crates/cortex_protocol",
    "crates/cortex_provider",
    "crates/cortex_provider_comfyui",
    "crates/cortex_provider_lmstudio",
    "crates/cortex_provider_native",
    "crates/cortex_provider_router",
