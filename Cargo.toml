    "crates/cortex_review",
    "crates/cortex_rpc",
    "crates/cortex_service",
    "crates/cortex_session",
    "crates/cortex_settings",
    "crates/cortex_task",
    "crates/cortex_toolchain",
    "crates/cortex_tools",
    "crates/cortex_transactions",
    "crates/cortex_universal",
    "crates/cortex_vault",
    "crates/cortex_web",
