# ─── Arbiter VSIX — Publish to Visual Studio Marketplace (M8-4) ──────────────
#
# Triggered automatically on:
#   1. A release tag push (v*.*.*)
#   2. Manual workflow_dispatch
#
# Requirements (repository secrets):
#   VS_MARKETPLACE_TOKEN  — Personal Access Token from
#                           https://marketplace.visualstudio.com/manage
#                           Scope: Marketplace → Manage
#
# The workflow:
#   1. Builds the VSIX with `dotnet build -c Release`
#   2. Bumps the version in source.extension.vsixmanifest to the tag version
#   3. Uploads the built .vsix as a GitHub Release asset
#   4. Publishes to the Visual Studio Marketplace using vsce / ovsx
# ─────────────────────────────────────────────────────────────────────────────
name: Publish VSIX to Marketplace

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.6.0) — leave blank to use tag"
        required: false
        default: ""
      dry_run:
        description: "Dry run — build but do not publish"
        type: boolean
        default: false

jobs:
  build-and-publish:
    name: Build VSIX and publish to Marketplace
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Resolve version ───────────────────────────────────────────────────
      - name: Resolve version string
        id: version
        shell: pwsh
        run: |
          $input = "${{ github.event.inputs.version }}"
          $tag   = "${{ github.ref_name }}"

          if ($input -ne "") {
            $v = $input.TrimStart("v")
          } elseif ($tag -match "^v?(\d+\.\d+\.\d+)") {
            $v = $Matches[1]
          } else {
            # Fallback: read from manifest
            [xml]$manifest = Get-Content `
              "VisualStudioExtension/ArbiterVSIX/source.extension.vsixmanifest"
            $v = $manifest.PackageManifest.Metadata.Identity.Version
          }

          Write-Output "VERSION=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing VSIX version: $v"

      # ── Patch version in vsixmanifest ─────────────────────────────────────
      - name: Bump vsixmanifest version
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          $path = "VisualStudioExtension/ArbiterVSIX/source.extension.vsixmanifest"
          $content = Get-Content $path -Raw
          $content = $content -replace '(<Identity[^>]*\sVersion=")[^"]*(")', "`${1}$v`$2"
          Set-Content $path $content -Encoding UTF8
          Write-Host "Set manifest version to $v"

      # ── Setup .NET ────────────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      # ── Restore & Build ───────────────────────────────────────────────────
      - name: Restore NuGet packages
        working-directory: VisualStudioExtension/ArbiterVSIX
        run: dotnet restore

      - name: Build VSIX (Release)
        working-directory: VisualStudioExtension/ArbiterVSIX
        run: dotnet build -c Release --no-restore

      # ── Find the .vsix file ───────────────────────────────────────────────
      - name: Locate built .vsix
        id: vsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path "VisualStudioExtension" -Recurse -Filter "*.vsix" |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1
          if (-not $vsix) { throw "No .vsix file found after build" }
          Write-Host "Found: $($vsix.FullName)"
          Write-Output "PATH=$($vsix.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "NAME=$($vsix.Name)"      >> $env:GITHUB_OUTPUT

      # ── Upload .vsix as GitHub Release asset ──────────────────────────────
      - name: Upload VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Publish to Visual Studio Marketplace ──────────────────────────────
      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to Visual Studio Marketplace
        if: ${{ !inputs.dry_run }}
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        shell: pwsh
        run: |
          # vsce uses the Personal Access Token via the --pat flag
          vsce publish `
            --vsix "${{ steps.vsix.outputs.PATH }}" `
            --pat  "$env:VS_MARKETPLACE_TOKEN"

      # ── Dry-run summary ───────────────────────────────────────────────────
      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN — VSIX built but NOT published."
          echo "VSIX: ${{ steps.vsix.outputs.NAME }}"
          echo "Version: ${{ steps.version.outputs.VERSION }}"

      # ── Upload VSIX as workflow artifact (always) ─────────────────────────
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-vsix-${{ steps.version.outputs.VERSION }}
          path: ${{ steps.vsix.outputs.PATH }}
          retention-days: 30
